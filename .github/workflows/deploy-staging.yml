# ==============================================================================
# ACMP Staging Deployment - ECS Express Mode
# Triggers on push to 'staging' branch
# Only deploys services that have changed
# ==============================================================================

name: Deploy Staging

on:
  push:
    branches: [staging]
  workflow_dispatch:
    inputs:
      deploy_api:
        description: 'Deploy API'
        type: boolean
        default: false
      deploy_web:
        description: 'Deploy Web'
        type: boolean
        default: false
      run_migrations:
        description: 'Run database migrations'
        type: boolean
        default: false

env:
  AWS_REGION: eu-central-1
  ECR_REPOSITORY_API: acmp/api
  ECR_REPOSITORY_WEB: acmp/web
  ECS_CLUSTER: acmp-staging
  ECS_SERVICE_API: acmp-api-staging
  ECS_SERVICE_WEB: acmp-web-staging

jobs:
  # ----------------------------------------------------------------------------
  # Detect which services changed
  # ----------------------------------------------------------------------------
  changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    outputs:
      api: ${{ steps.filter.outputs.api }}
      web: ${{ steps.filter.outputs.web }}
      migrations: ${{ steps.filter.outputs.migrations }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Check for changes
        uses: dorny/paths-filter@v3
        id: filter
        with:
          base: ${{ github.event.before }}
          filters: |
            api:
              - 'apps/api/**'
              - 'packages/shared/**'
              - 'packages/validators/**'
            web:
              - 'apps/web/**'
              - 'packages/shared/**'
              - 'packages/validators/**'
            migrations:
              - 'apps/api/src/database/migrations/**'

  # ----------------------------------------------------------------------------
  # Run database migrations (one-off task)
  # Only runs if migrations changed or manually triggered
  # ----------------------------------------------------------------------------
  run-migrations:
    name: Run Migrations
    runs-on: ubuntu-latest
    needs: [changes]
    if: ${{ needs.changes.outputs.migrations == 'true' || github.event.inputs.run_migrations == 'true' }}
    environment: staging
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: ${{ env.AWS_REGION }}
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          role-session-name: GitHubActionsRunMigrations

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Get short commit hash
        run: echo "IMAGE_TAG=${GITHUB_SHA:0:7}" >> $GITHUB_ENV

      - name: Build migration image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./apps/api/Dockerfile
          target: production
          push: true
          tags: |
            ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY_API }}:${{ env.IMAGE_TAG }}-migration

      - name: Run migrations via ECS task
        run: |
          echo "Running database migrations..."
          
          # Get network configuration from a running task (ECS Express Mode doesn't expose it via describe-services)
          TASK_ARN=$(aws ecs list-tasks \
            --cluster ${{ env.ECS_CLUSTER }} \
            --service-name ${{ env.ECS_SERVICE_API }} \
            --desired-status RUNNING \
            --query 'taskArns[0]' \
            --output text 2>/dev/null || echo "")
          
          if [ -z "$TASK_ARN" ] || [ "$TASK_ARN" == "None" ]; then
            echo "No running tasks found. Will use default VPC configuration."
            echo "Migrations will need to run manually or on next deployment with a running service."
            exit 0
          fi
          
          # Get subnet from task attachment
          SUBNET=$(aws ecs describe-tasks \
            --cluster ${{ env.ECS_CLUSTER }} \
            --tasks "$TASK_ARN" \
            --query 'tasks[0].attachments[0].details[?name==`subnetId`].value' \
            --output text)
          
          # Get ENI to find security group
          ENI_ID=$(aws ecs describe-tasks \
            --cluster ${{ env.ECS_CLUSTER }} \
            --tasks "$TASK_ARN" \
            --query 'tasks[0].attachments[0].details[?name==`networkInterfaceId`].value' \
            --output text)
          
          SECURITY_GROUP=$(aws ec2 describe-network-interfaces \
            --network-interface-ids "$ENI_ID" \
            --query 'NetworkInterfaces[0].Groups[0].GroupId' \
            --output text)
          
          echo "Found subnet: $SUBNET"
          echo "Found security group: $SECURITY_GROUP"
          
          if [ -z "$SUBNET" ] || [ -z "$SECURITY_GROUP" ]; then
            echo "Could not determine network configuration."
            exit 1
          fi
          
          # Register a one-off task definition for migrations
          TASK_DEF=$(cat <<EOF
          {
            "family": "acmp-api-staging-migration",
            "networkMode": "awsvpc",
            "requiresCompatibilities": ["FARGATE"],
            "cpu": "256",
            "memory": "512",
            "executionRoleArn": "arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/ecsTaskExecutionRole",
            "containerDefinitions": [
              {
                "name": "migration",
                "image": "${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY_API }}:${{ env.IMAGE_TAG }}-migration",
                "essential": true,
                "command": ["npx", "typeorm", "migration:run", "-d", "dist/src/database/data-source.js"],
                "environment": [
                  {"name": "NODE_ENV", "value": "staging"},
                  {"name": "DATABASE_HOST", "value": "${{ vars.DATABASE_HOST }}"},
                  {"name": "DATABASE_PORT", "value": "5432"},
                  {"name": "DATABASE_USER", "value": "${{ vars.DATABASE_USER }}"},
                  {"name": "DATABASE_NAME", "value": "${{ vars.DATABASE_NAME }}"},
                  {"name": "DATABASE_SSL", "value": "true"}
                ],
                "secrets": [
                  {"name": "DATABASE_PASSWORD", "valueFrom": "arn:aws:secretsmanager:eu-central-1:${{ secrets.AWS_ACCOUNT_ID }}:secret:acmp-staging-database-password-0ZwEXK"}
                ],
                "logConfiguration": {
                  "logDriver": "awslogs",
                  "options": {
                    "awslogs-group": "/aws/ecs/acmp-staging/migrations",
                    "awslogs-region": "${{ env.AWS_REGION }}",
                    "awslogs-stream-prefix": "migration",
                    "awslogs-create-group": "true"
                  }
                }
              }
            ]
          }
          EOF
          )
          
          # Register task definition
          TASK_DEF_ARN=$(aws ecs register-task-definition \
            --cli-input-json "$TASK_DEF" \
            --query 'taskDefinition.taskDefinitionArn' \
            --output text)
          
          echo "Registered task definition: $TASK_DEF_ARN"
          
          # Run the migration task
          MIGRATION_TASK_ARN=$(aws ecs run-task \
            --cluster ${{ env.ECS_CLUSTER }} \
            --task-definition "$TASK_DEF_ARN" \
            --launch-type FARGATE \
            --network-configuration "awsvpcConfiguration={subnets=[$SUBNET],securityGroups=[$SECURITY_GROUP],assignPublicIp=DISABLED}" \
            --query 'tasks[0].taskArn' \
            --output text)
          
          echo "Started migration task: $MIGRATION_TASK_ARN"
          
          # Wait for task to complete
          echo "Waiting for migration task to complete..."
          aws ecs wait tasks-stopped \
            --cluster ${{ env.ECS_CLUSTER }} \
            --tasks "$MIGRATION_TASK_ARN"
          
          # Check exit code
          EXIT_CODE=$(aws ecs describe-tasks \
            --cluster ${{ env.ECS_CLUSTER }} \
            --tasks "$MIGRATION_TASK_ARN" \
            --query 'tasks[0].containers[0].exitCode' \
            --output text)
          
          if [ "$EXIT_CODE" != "0" ]; then
            echo "Migration failed with exit code: $EXIT_CODE"
            echo "Check CloudWatch logs for details: /aws/ecs/acmp-staging/migrations"
            exit 1
          fi
          
          echo "Migrations completed successfully!"

  # ----------------------------------------------------------------------------
  # Build and Deploy API
  # ----------------------------------------------------------------------------
  deploy-api:
    name: Deploy API
    runs-on: ubuntu-latest
    needs: [changes, run-migrations]
    # Run if API changed, or manually triggered, and wait for migrations if they ran
    if: |
      always() && 
      (needs.changes.outputs.api == 'true' || github.event.inputs.deploy_api == 'true') &&
      (needs.run-migrations.result == 'success' || needs.run-migrations.result == 'skipped')
    environment: staging
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: ${{ env.AWS_REGION }}
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          role-session-name: GitHubActionsDeployStaging

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Get short commit hash
        run: echo "IMAGE_TAG=${GITHUB_SHA:0:7}" >> $GITHUB_ENV

      - name: Build and push API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./apps/api/Dockerfile
          target: production
          push: true
          tags: |
            ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY_API }}:${{ env.IMAGE_TAG }}
            ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY_API }}:staging-latest

      - name: Deploy API to ECS Express Mode
        uses: aws-actions/amazon-ecs-deploy-express-service@v1
        with:
          service-name: ${{ env.ECS_SERVICE_API }}
          cluster: ${{ env.ECS_CLUSTER }}
          image: ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY_API }}:${{ env.IMAGE_TAG }}
          execution-role-arn: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/ecsTaskExecutionRole
          infrastructure-role-arn: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/ecsInfrastructureRoleForExpressServices
          container-port: 3000
          cpu: '256'
          memory: '512'
          health-check-path: /api/health
          min-task-count: 1
          max-task-count: 2
          auto-scaling-metric: AVERAGE_CPU
          auto-scaling-target-value: 70
          environment-variables: |
            [
              {"name": "NODE_ENV", "value": "staging"},
              {"name": "PORT", "value": "3000"},
              {"name": "DATABASE_HOST", "value": "${{ vars.DATABASE_HOST }}"},
              {"name": "DATABASE_PORT", "value": "5432"},
              {"name": "DATABASE_USER", "value": "${{ vars.DATABASE_USER }}"},
              {"name": "DATABASE_NAME", "value": "${{ vars.DATABASE_NAME }}"},
              {"name": "DATABASE_SSL", "value": "true"},
              {"name": "JWT_EXPIRES_IN", "value": "7d"},
              {"name": "AWS_REGION", "value": "${{ env.AWS_REGION }}"},
              {"name": "AWS_S3_BUCKET", "value": "${{ vars.AWS_S3_BUCKET }}"},
              {"name": "CORS_ORIGINS", "value": "${{ vars.CORS_ORIGIN }}"},
              {"name": "FRONTEND_URL", "value": "${{ vars.FRONTEND_URL }}"},
              {"name": "MAILCHIMP_FROM_EMAIL", "value": "${{ vars.MAILCHIMP_FROM_EMAIL }}"},
              {"name": "MAILCHIMP_FROM_NAME", "value": "${{ vars.MAILCHIMP_FROM_NAME }}"}
            ]
          secrets: |
            [
              {"name": "DATABASE_PASSWORD", "valueFrom": "arn:aws:secretsmanager:eu-central-1:${{ secrets.AWS_ACCOUNT_ID }}:secret:acmp-staging-database-password-0ZwEXK"},
              {"name": "JWT_SECRET", "valueFrom": "arn:aws:secretsmanager:eu-central-1:${{ secrets.AWS_ACCOUNT_ID }}:secret:acmp-staging-jwt-secret-gK3vud"},
              {"name": "MAILCHIMP_API_KEY", "valueFrom": "arn:aws:secretsmanager:eu-central-1:${{ secrets.AWS_ACCOUNT_ID }}:secret:acmp-staging-mailchimp-api-key-Nfy935"}
            ]

  # ----------------------------------------------------------------------------
  # Build and Deploy Web
  # ----------------------------------------------------------------------------
  deploy-web:
    name: Deploy Web
    runs-on: ubuntu-latest
    needs: changes
    if: ${{ needs.changes.outputs.web == 'true' || github.event.inputs.deploy_web == 'true' }}
    environment: staging
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: ${{ env.AWS_REGION }}
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          role-session-name: GitHubActionsDeployStaging

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Get short commit hash
        run: echo "IMAGE_TAG=${GITHUB_SHA:0:7}" >> $GITHUB_ENV

      - name: Build and push Web image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./apps/web/Dockerfile
          target: production
          push: true
          build-args: |
            NEXT_PUBLIC_API_URL=${{ vars.NEXT_PUBLIC_API_URL }}
            NEXT_PUBLIC_WS_URL=${{ vars.NEXT_PUBLIC_WS_URL }}
          tags: |
            ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY_WEB }}:${{ env.IMAGE_TAG }}
            ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY_WEB }}:staging-latest

      - name: Deploy Web to ECS Express Mode
        uses: aws-actions/amazon-ecs-deploy-express-service@v1
        with:
          service-name: ${{ env.ECS_SERVICE_WEB }}
          cluster: ${{ env.ECS_CLUSTER }}
          image: ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY_WEB }}:${{ env.IMAGE_TAG }}
          execution-role-arn: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/ecsTaskExecutionRole
          infrastructure-role-arn: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/ecsInfrastructureRoleForExpressServices
          container-port: 3000
          cpu: '256'
          memory: '512'
          health-check-path: /api/health
          min-task-count: 1
          max-task-count: 2
          auto-scaling-metric: AVERAGE_CPU
          auto-scaling-target-value: 70
