# ==============================================================================
# ACMP Staging Deployment - ECS Express Mode
# Triggers on push to 'staging' branch
# Only deploys services that have changed
# ==============================================================================

name: Deploy Staging

on:
  push:
    branches: [staging]
  workflow_dispatch:
    inputs:
      deploy_api:
        description: 'Deploy API'
        type: boolean
        default: false
      deploy_web:
        description: 'Deploy Web'
        type: boolean
        default: false
      run_migrations:
        description: 'Run database migrations'
        type: boolean
        default: false

env:
  AWS_REGION: eu-central-1
  ECR_REPOSITORY_API: acmp/api
  ECR_REPOSITORY_WEB: acmp/web
  ECS_CLUSTER: acmp-staging
  ECS_SERVICE_API: acmp-api-staging
  ECS_SERVICE_WEB: acmp-web-staging

jobs:
  # ----------------------------------------------------------------------------
  # Run Tests First
  # ----------------------------------------------------------------------------
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: acmp_regression_ci_test
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: [6379:6379]
    env:
      ACMP_TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/acmp_regression_ci_test
      ACMP_TEST_REDIS_URL: redis://localhost:6379
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --no-audit

      - name: Build shared packages
        run: |
          npm run build -w @acmp/shared
          npm run build -w @acmp/validators

      - name: Run type checking
        run: npm run type-check

      - name: Run lint
        run: npm run lint

      - name: Build all workspaces
        run: npm run build

      - name: Run tests
        run: npm run test -w @acmp/api -- --runInBand

      - name: Install browser
        run: npx playwright install --with-deps chromium

      - name: Browser regressions
        run: npm run test:browser -w @acmp/web

  # ----------------------------------------------------------------------------
  # Detect which services changed
  # ----------------------------------------------------------------------------
  changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    needs: test
    if: needs.test.result == 'success'
    outputs:
      api: ${{ steps.filter.outputs.api }}
      web: ${{ steps.filter.outputs.web }}
      migrations: ${{ steps.filter.outputs.migrations }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Check for changes
        uses: dorny/paths-filter@v3
        id: filter
        with:
          base: ${{ github.event.before }}
          filters: |
            api:
              - '.github/workflows/deploy-staging.yml'
              - 'scripts/update-alb-rules.sh'
              - 'apps/api/**'
              - 'packages/shared/**'
              - 'packages/validators/**'
            web:
              - 'apps/web/**'
              - 'packages/shared/**'
              - 'packages/validators/**'
            migrations:
              - 'apps/api/src/database/migrations/**'

  # ----------------------------------------------------------------------------
  # Run database migrations (one-off task)
  # Only runs if migrations changed or manually triggered
  # Manual input of 'false' will skip migrations even if files changed
  # ----------------------------------------------------------------------------
  run-migrations:
    name: Run Migrations
    runs-on: ubuntu-latest
    needs: [changes]
    if: |
      (github.event_name == 'push' && needs.changes.outputs.migrations == 'true') ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.run_migrations == 'true')
    environment: staging
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-region: ${{ env.AWS_REGION }}
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          role-session-name: GitHubActionsRunMigrations

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Get short commit hash
        run: echo "IMAGE_TAG=${GITHUB_SHA:0:7}" >> $GITHUB_ENV

      - name: Build migration image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./apps/api/Dockerfile
          target: production
          push: true
          tags: |
            ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY_API }}:${{ env.IMAGE_TAG }}-migration

      - name: Run migrations via ECS task
        run: |
          echo "Running database migrations..."
          
          # Create the log group if it doesn't exist (execution role may not have CreateLogGroup permission)
          aws logs create-log-group --log-group-name "/aws/ecs/acmp-staging/migrations" 2>/dev/null || echo "Log group already exists or will be created"
          
          # Explicit networking also works before the first API task exists.
          SUBNET="${{ vars.MIGRATION_SUBNET }}"
          SECURITY_GROUP="${{ vars.MIGRATION_SECURITY_GROUP }}"
          test -n "$SUBNET" && test -n "$SECURITY_GROUP"

          # Register a one-off task definition for migrations
          TASK_DEF=$(cat <<EOF
          {
            "family": "acmp-api-staging-migration",
            "networkMode": "awsvpc",
            "requiresCompatibilities": ["FARGATE"],
            "cpu": "256",
            "memory": "512",
            "executionRoleArn": "${{ vars.ECS_EXECUTION_ROLE_ARN }}",
            "containerDefinitions": [
              {
                "name": "migration",
                "image": "${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY_API }}:${{ env.IMAGE_TAG }}-migration",
                "essential": true,
                "entryPoint": ["npx", "--no-install", "typeorm"],
                "command": [ "migration:run", "-d", "dist/apps/api/src/database/data-source.js"],
                "environment": [
                  {"name": "NODE_ENV", "value": "staging"},
                  {"name": "DATABASE_HOST", "value": "${{ vars.DATABASE_HOST }}"},
                  {"name": "DATABASE_PORT", "value": "5432"},
                  {"name": "DATABASE_USER", "value": "${{ vars.DATABASE_USER }}"},
                  {"name": "DATABASE_NAME", "value": "${{ vars.DATABASE_NAME }}"},
                  {"name": "DATABASE_SSL", "value": "true"}
                ],
                "secrets": [
                  {"name": "DATABASE_PASSWORD", "valueFrom": "${{ secrets.DATABASE_PASSWORD_ARN }}"}
                ],
                "logConfiguration": {
                  "logDriver": "awslogs",
                  "options": {
                    "awslogs-group": "/aws/ecs/acmp-staging/migrations",
                    "awslogs-region": "${{ env.AWS_REGION }}",
                    "awslogs-stream-prefix": "migration"
                  }
                }
              }
            ]
          }
          EOF
          )
          
          # Register task definition
          TASK_DEF_ARN=$(aws ecs register-task-definition \
            --cli-input-json "$TASK_DEF" \
            --query 'taskDefinition.taskDefinitionArn' \
            --output text)
          
          echo "Registered task definition: $TASK_DEF_ARN"
          
          # Run the migration task with ENABLED public IP to allow Secrets Manager access
          # (needed if subnet doesn't have VPC endpoints for Secrets Manager)
          MIGRATION_TASK_ARN=$(aws ecs run-task \
            --cluster ${{ env.ECS_CLUSTER }} \
            --task-definition "$TASK_DEF_ARN" \
            --launch-type FARGATE \
            --network-configuration "awsvpcConfiguration={subnets=[$SUBNET],securityGroups=[$SECURITY_GROUP],assignPublicIp=ENABLED}" \
            --query 'tasks[0].taskArn' \
            --output text)
          
          echo "Started migration task: $MIGRATION_TASK_ARN"
          
          # Wait for task to complete (timeout after 10 minutes)
          echo "Waiting for migration task to complete..."
          aws ecs wait tasks-stopped \
            --cluster ${{ env.ECS_CLUSTER }} \
            --tasks "$MIGRATION_TASK_ARN"
          
          # Check exit code
          TASK_STATUS=$(aws ecs describe-tasks \
            --cluster ${{ env.ECS_CLUSTER }} \
            --tasks "$MIGRATION_TASK_ARN" \
            --query 'tasks[0].{exitCode:containers[0].exitCode,stoppedReason:stoppedReason}' \
            --output json)
          
          EXIT_CODE=$(echo "$TASK_STATUS" | jq -r '.exitCode // "null"')
          STOPPED_REASON=$(echo "$TASK_STATUS" | jq -r '.stoppedReason // "unknown"')
          
          echo "Task exit code: $EXIT_CODE"
          echo "Stopped reason: $STOPPED_REASON"
          
          if [ "$EXIT_CODE" != "0" ]; then
            echo "Migration failed!"
            echo "Check CloudWatch logs for details: /aws/ecs/acmp-staging/migrations"
            exit 1
          fi
          
          echo "Migrations completed successfully!"

  # ----------------------------------------------------------------------------
  # Build and Deploy API
  # ----------------------------------------------------------------------------
  deploy-api:
    name: Deploy API
    runs-on: ubuntu-latest
    needs: [test, changes, run-migrations]
    # Run if API changed, or manually triggered, and wait for migrations if they ran
    if: |
      always() && 
      needs.test.result == 'success' &&
      (needs.changes.outputs.api == 'true' || github.event.inputs.deploy_api == 'true') &&
      (needs.run-migrations.result == 'success' || needs.run-migrations.result == 'skipped')
    environment: staging
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-region: ${{ env.AWS_REGION }}
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          role-session-name: GitHubActionsDeployStaging

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Get short commit hash
        run: echo "IMAGE_TAG=${GITHUB_SHA:0:7}" >> $GITHUB_ENV

      - name: Validate Zoom configuration
        env:
          ZOOM_ACCOUNT_ID: ${{ vars.ZOOM_ACCOUNT_ID }}
          ZOOM_CLIENT_ID: ${{ vars.ZOOM_CLIENT_ID }}
          ZOOM_CLIENT_SECRET: ${{ secrets.ZOOM_CLIENT_SECRET }}
          ZOOM_HOST_USER_ID: ${{ vars.ZOOM_HOST_USER_ID }}
        run: |
          for name in ZOOM_ACCOUNT_ID ZOOM_CLIENT_ID ZOOM_CLIENT_SECRET ZOOM_HOST_USER_ID; do
            if [ -z "${!name}" ]; then
              echo "::error::$name is required for Zoom brief events"
              exit 1
            fi
          done

      - name: Validate email sender configuration
        env:
          RESEND_FROM_EMAIL: ${{ vars.RESEND_FROM_EMAIL }}
          RESEND_FROM_NAME: ${{ vars.RESEND_FROM_NAME }}
        run: |
          for name in RESEND_FROM_EMAIL RESEND_FROM_NAME; do
            if [ -z "${!name}" ]; then
              echo "::error::$name is required for invitation emails"
              exit 1
            fi
          done

      - name: Build and push API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./apps/api/Dockerfile
          target: production
          push: true
          tags: |
            ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY_API }}:${{ env.IMAGE_TAG }}
            ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY_API }}:staging-${{ env.IMAGE_TAG }}
            ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY_API }}:staging-latest

      - name: Deploy API to ECS Express Mode
        uses: aws-actions/amazon-ecs-deploy-express-service@v1
        with:
          service-name: ${{ env.ECS_SERVICE_API }}
          cluster: ${{ env.ECS_CLUSTER }}
          image: ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY_API }}:${{ env.IMAGE_TAG }}
          execution-role-arn: ${{ vars.ECS_EXECUTION_ROLE_ARN }}
          infrastructure-role-arn: ${{ vars.ECS_INFRASTRUCTURE_ROLE_ARN }}
          task-role-arn: ${{ vars.ECS_TASK_ROLE_ARN }}
          container-port: 3000
          cpu: '256'
          memory: '512'
          health-check-path: /api/health/ready
          min-task-count: 1
          max-task-count: 2
          auto-scaling-metric: AVERAGE_CPU
          auto-scaling-target-value: 70
          environment-variables: |
            [
              {"name": "NODE_ENV", "value": "staging"},
              {"name": "PORT", "value": "3000"},
              {"name": "DATABASE_HOST", "value": "${{ vars.DATABASE_HOST }}"},
              {"name": "DATABASE_PORT", "value": "5432"},
              {"name": "DATABASE_USER", "value": "${{ vars.DATABASE_USER }}"},
              {"name": "DATABASE_NAME", "value": "${{ vars.DATABASE_NAME }}"},
              {"name": "DATABASE_SSL", "value": "true"},
              {"name": "JWT_EXPIRES_IN", "value": "7d"},
              {"name": "AWS_REGION", "value": "${{ env.AWS_REGION }}"},
              {"name": "AWS_S3_BUCKET", "value": "${{ vars.AWS_S3_BUCKET }}"},
              {"name": "CORS_ORIGINS", "value": "${{ vars.CORS_ORIGIN }}"},
              {"name": "FRONTEND_URL", "value": "${{ vars.FRONTEND_URL }}"},
              {"name": "MAILCHIMP_FROM_EMAIL", "value": "${{ vars.MAILCHIMP_FROM_EMAIL }}"},
              {"name": "MAILCHIMP_FROM_NAME", "value": "${{ vars.MAILCHIMP_FROM_NAME }}"},
              {"name": "SMTP_HOST", "value": "${{ vars.SMTP_HOST }}"},
              {"name": "SMTP_PORT", "value": "${{ vars.SMTP_PORT }}"},
              {"name": "SMTP_SECURE", "value": "${{ vars.SMTP_SECURE }}"},
              {"name": "SMTP_FROM_EMAIL", "value": "${{ vars.SMTP_FROM_EMAIL }}"},
              {"name": "SMTP_FROM_NAME", "value": "${{ vars.SMTP_FROM_NAME }}"},
              {"name": "RESEND_FROM_EMAIL", "value": ${{ toJSON(vars.RESEND_FROM_EMAIL) }}},
              {"name": "RESEND_FROM_NAME", "value": ${{ toJSON(vars.RESEND_FROM_NAME) }}},
              {"name": "RESEND_API_KEY", "value": "${{ secrets.RESEND_API_KEY }}"},
              {"name": "REDIS_HOST", "value": "${{ vars.REDIS_HOST }}"},
              {"name": "REDIS_PORT", "value": "6379"},
              {"name": "GEMINI_MODEL", "value": "${{ vars.GEMINI_MODEL }}"},
              {"name": "GEMINI_API_KEY", "value": "${{ secrets.GEMINI_API_KEY }}"},
              {"name": "GITHUB_TOKEN", "value": "${{ secrets.GITHUB_TOKEN }}"},
              {"name": "ONESIGNAL_APP_ID", "value": "${{ vars.ONESIGNAL_APP_ID }}"},
              {"name": "ONESIGNAL_REST_API_KEY", "value": "${{ secrets.ONESIGNAL_REST_API_KEY }}"},
              {"name": "ZOOM_ACCOUNT_ID", "value": ${{ toJSON(vars.ZOOM_ACCOUNT_ID) }}},
              {"name": "ZOOM_CLIENT_ID", "value": ${{ toJSON(vars.ZOOM_CLIENT_ID) }}},
              {"name": "ZOOM_CLIENT_SECRET", "value": ${{ toJSON(secrets.ZOOM_CLIENT_SECRET) }}},
              {"name": "ZOOM_HOST_USER_ID", "value": ${{ toJSON(vars.ZOOM_HOST_USER_ID) }}}
            ]
          secrets: |
            [
              {"name": "DATABASE_PASSWORD", "valueFrom": "${{ secrets.DATABASE_PASSWORD_ARN }}"},
              {"name": "JWT_SECRET", "valueFrom": "${{ secrets.JWT_SECRET_ARN }}"},
              {"name": "MAILCHIMP_API_KEY", "valueFrom": "${{ secrets.MAILCHIMP_API_KEY_ARN }}"},
              {"name": "GOOGLE_SERVICE_ACCOUNT_EMAIL", "valueFrom": "${{ secrets.GOOGLE_SERVICE_ACCOUNT_EMAIL_ARN }}"},
              {"name": "GOOGLE_PRIVATE_KEY", "valueFrom": "${{ secrets.GOOGLE_PRIVATE_KEY_ARN }}"},
              {"name": "GOOGLE_ADMIN_EMAIL", "valueFrom": "${{ secrets.GOOGLE_ADMIN_EMAIL_ARN }}"},
              {"name": "GOOGLE_CALENDAR_EMAIL", "valueFrom": "${{ secrets.GOOGLE_CALENDAR_EMAIL_ARN }}"},
              {"name": "SMTP_USER", "valueFrom": "${{ secrets.SMTP_USER_ARN }}"},
              {"name": "SMTP_PASS", "valueFrom": "${{ secrets.SMTP_PASS_ARN }}"}
            ]

  # ----------------------------------------------------------------------------
  # Build and Deploy Web
  # ----------------------------------------------------------------------------
  deploy-web:
    name: Deploy Web
    runs-on: ubuntu-latest
    needs: [test, changes]
    if: needs.test.result == 'success' && (needs.changes.outputs.web == 'true' || github.event.inputs.deploy_web == 'true')
    environment: staging
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-region: ${{ env.AWS_REGION }}
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          role-session-name: GitHubActionsDeployStaging

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Get short commit hash
        run: echo "IMAGE_TAG=${GITHUB_SHA:0:7}" >> $GITHUB_ENV

      - name: Build and push Web image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./apps/web/Dockerfile
          target: production
          push: true
          build-args: |
            NEXT_PUBLIC_API_URL=${{ vars.NEXT_PUBLIC_API_URL }}
            NEXT_PUBLIC_WS_URL=${{ vars.NEXT_PUBLIC_WS_URL }}
            NEXT_PUBLIC_ONESIGNAL_APP_ID=${{ vars.ONESIGNAL_APP_ID }}
          tags: |
            ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY_WEB }}:${{ env.IMAGE_TAG }}
            ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY_WEB }}:staging-${{ env.IMAGE_TAG }}
            ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY_WEB }}:staging-latest

      - name: Deploy Web to ECS Express Mode
        uses: aws-actions/amazon-ecs-deploy-express-service@v1
        with:
          service-name: ${{ env.ECS_SERVICE_WEB }}
          cluster: ${{ env.ECS_CLUSTER }}
          image: ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY_WEB }}:${{ env.IMAGE_TAG }}
          execution-role-arn: ${{ vars.ECS_EXECUTION_ROLE_ARN }}
          infrastructure-role-arn: ${{ vars.ECS_INFRASTRUCTURE_ROLE_ARN }}
          container-port: 3000
          cpu: '256'
          memory: '512'
          health-check-path: /api/health
          min-task-count: 1
          max-task-count: 2
          auto-scaling-metric: AVERAGE_CPU
          auto-scaling-target-value: 70

  # ----------------------------------------------------------------------------
  # Update ALB Rules for Custom Domains
  # ----------------------------------------------------------------------------
  update-alb-rules:
    name: Update ALB Rules
    runs-on: ubuntu-latest
    needs: [deploy-api, deploy-web]
    # Run if either deployment ran (even if one was skipped)
    if: |
      always() && 
      (needs.deploy-api.result == 'success' || needs.deploy-web.result == 'success')
    environment: staging
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-region: ${{ env.AWS_REGION }}
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          role-session-name: GitHubActionsUpdateALB

      - name: Wait for services to stabilize
        run: |
          echo "Waiting 30 seconds for ECS services to stabilize..."
          sleep 30

      - name: Update ALB listener rules
        env:
          AWS_REGION: ${{ env.AWS_REGION }}
          LISTENER_ARN: ${{ vars.ALB_LISTENER_ARN }}
        run: |
          chmod +x ./scripts/update-alb-rules.sh
          ./scripts/update-alb-rules.sh staging

      - name: Verify endpoints
        run: |
          echo "Verifying endpoints..."
          API_STATUS=$(curl -sSL --max-time 10 https://api-staging.atfchallenge.org/api/health | jq -r '.status' 2>/dev/null || echo "FAILED")
          WEB_STATUS=$(curl -sSL --max-time 10 -o /dev/null -w '%{http_code}' https://app-staging.atfchallenge.org 2>/dev/null || echo "FAILED")
          
          echo "API Status: $API_STATUS"
          echo "Web Status: $WEB_STATUS"
          
          if [ "$API_STATUS" != "ok" ] || [ "$WEB_STATUS" != "200" ]; then
            echo "WARNING: Some endpoints may not be responding correctly"
            exit 1
          fi
          
          echo "All endpoints verified successfully!"
