# ==============================================================================
# ACMP Production Deployment - ECS Express Mode
# Triggers on push to 'main' branch
# Only deploys services that have changed
# ==============================================================================

name: Deploy Production

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      deploy_api:
        description: 'Deploy API'
        type: boolean
        default: false
      deploy_web:
        description: 'Deploy Web'
        type: boolean
        default: false
      run_migrations:
        description: 'Run database migrations'
        type: boolean
        default: false

env:
  AWS_REGION: eu-central-1
  ECR_REPOSITORY_API: acmp/api
  ECR_REPOSITORY_WEB: acmp/web
  ECS_CLUSTER: acmp-production
  ECS_SERVICE_API: acmp-api-production
  ECS_SERVICE_WEB: acmp-web-production

jobs:
  # ----------------------------------------------------------------------------
  # Run Tests First
  # ----------------------------------------------------------------------------
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run type checking
        run: npm run type-check

      - name: Run tests
        run: npm run test --if-present

  # ----------------------------------------------------------------------------
  # Detect which services changed
  # ----------------------------------------------------------------------------
  changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    needs: test
    if: needs.test.result == 'success'
    outputs:
      api: ${{ steps.filter.outputs.api }}
      web: ${{ steps.filter.outputs.web }}
      migrations: ${{ steps.filter.outputs.migrations }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Check for changes
        uses: dorny/paths-filter@v3
        id: filter
        with:
          base: ${{ github.event.before }}
          filters: |
            api:
              - 'apps/api/**'
              - 'packages/shared/**'
              - 'packages/validators/**'
            web:
              - 'apps/web/**'
              - 'packages/shared/**'
              - 'packages/validators/**'
            migrations:
              - 'apps/api/src/database/migrations/**'

  # ----------------------------------------------------------------------------
  # Run database migrations via ECS Task (runs inside VPC to access RDS)
  # Only runs if migrations changed or manually triggered
  # ----------------------------------------------------------------------------
  run-migrations:
    name: Run Migrations
    runs-on: ubuntu-latest
    needs: [changes]
    if: |
      (github.event_name == 'push' && needs.changes.outputs.migrations == 'true') ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.run_migrations == 'true')
    environment: production
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-region: ${{ env.AWS_REGION }}
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          role-session-name: GitHubActionsRunMigrationsProduction

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Get short commit hash
        run: echo "IMAGE_TAG=${GITHUB_SHA:0:7}" >> $GITHUB_ENV

      - name: Build migration image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./apps/api/Dockerfile
          target: production
          push: true
          tags: |
            ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY_API }}:${{ env.IMAGE_TAG }}-migration

      - name: Run migrations via ECS task
        run: |
          echo "Running database migrations..."
          
          # Create the log group if it doesn't exist
          aws logs create-log-group --log-group-name "/aws/ecs/acmp-production/migrations" 2>/dev/null || echo "Log group already exists or will be created"
          
          # Get network configuration from a running task (ECS Express Mode doesn't expose it via describe-services)
          TASK_ARN=$(aws ecs list-tasks \
            --cluster ${{ env.ECS_CLUSTER }} \
            --service-name ${{ env.ECS_SERVICE_API }} \
            --desired-status RUNNING \
            --query 'taskArns[0]' \
            --output text 2>/dev/null || echo "")
          
          if [ -z "$TASK_ARN" ] || [ "$TASK_ARN" == "None" ]; then
            echo "No running tasks found. This is the first deployment - migrations will run on next deployment."
            echo "For first-time setup, deploy the API first, then trigger migrations manually."
            exit 0
          fi
          
          # Get subnet from task attachment
          SUBNET=$(aws ecs describe-tasks \
            --cluster ${{ env.ECS_CLUSTER }} \
            --tasks "$TASK_ARN" \
            --query 'tasks[0].attachments[0].details[?name==`subnetId`].value' \
            --output text)
          
          # Get ENI to find security group
          ENI_ID=$(aws ecs describe-tasks \
            --cluster ${{ env.ECS_CLUSTER }} \
            --tasks "$TASK_ARN" \
            --query 'tasks[0].attachments[0].details[?name==`networkInterfaceId`].value' \
            --output text)
          
          SECURITY_GROUP=$(aws ec2 describe-network-interfaces \
            --network-interface-ids "$ENI_ID" \
            --query 'NetworkInterfaces[0].Groups[0].GroupId' \
            --output text)
          
          echo "Found subnet: $SUBNET"
          echo "Found security group: $SECURITY_GROUP"
          
          if [ -z "$SUBNET" ] || [ -z "$SECURITY_GROUP" ]; then
            echo "Could not determine network configuration."
            exit 1
          fi
          
          # Register a one-off task definition for migrations
          TASK_DEF=$(cat <<EOF
          {
            "family": "acmp-api-production-migration",
            "networkMode": "awsvpc",
            "requiresCompatibilities": ["FARGATE"],
            "cpu": "256",
            "memory": "512",
            "executionRoleArn": "${{ vars.ECS_TASK_EXECUTION_ROLE_ARN }}",
            "containerDefinitions": [
              {
                "name": "migration",
                "image": "${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY_API }}:${{ env.IMAGE_TAG }}-migration",
                "essential": true,
                "command": ["npx", "typeorm", "migration:run", "-d", "dist/src/database/data-source.js"],
                "environment": [
                  {"name": "NODE_ENV", "value": "production"},
                  {"name": "DATABASE_HOST", "value": "${{ vars.DATABASE_HOST }}"},
                  {"name": "DATABASE_PORT", "value": "5432"},
                  {"name": "DATABASE_USER", "value": "${{ vars.DATABASE_USER }}"},
                  {"name": "DATABASE_NAME", "value": "${{ vars.DATABASE_NAME }}"},
                  {"name": "DATABASE_SSL", "value": "true"}
                ],
                "secrets": [
                  {"name": "DATABASE_PASSWORD", "valueFrom": "${{ secrets.DATABASE_PASSWORD_ARN }}"}
                ],
                "logConfiguration": {
                  "logDriver": "awslogs",
                  "options": {
                    "awslogs-group": "/aws/ecs/acmp-production/migrations",
                    "awslogs-region": "${{ env.AWS_REGION }}",
                    "awslogs-stream-prefix": "migration"
                  }
                }
              }
            ]
          }
          EOF
          )
          
          # Register task definition
          TASK_DEF_ARN=$(aws ecs register-task-definition \
            --cli-input-json "$TASK_DEF" \
            --query 'taskDefinition.taskDefinitionArn' \
            --output text)
          
          echo "Registered task definition: $TASK_DEF_ARN"
          
          # Run the migration task with ENABLED public IP to allow Secrets Manager access
          MIGRATION_TASK_ARN=$(aws ecs run-task \
            --cluster ${{ env.ECS_CLUSTER }} \
            --task-definition "$TASK_DEF_ARN" \
            --launch-type FARGATE \
            --network-configuration "awsvpcConfiguration={subnets=[$SUBNET],securityGroups=[$SECURITY_GROUP],assignPublicIp=ENABLED}" \
            --query 'tasks[0].taskArn' \
            --output text)
          
          echo "Started migration task: $MIGRATION_TASK_ARN"
          
          # Wait for task to complete (timeout after 10 minutes)
          echo "Waiting for migration task to complete..."
          aws ecs wait tasks-stopped \
            --cluster ${{ env.ECS_CLUSTER }} \
            --tasks "$MIGRATION_TASK_ARN"
          
          # Check exit code
          TASK_STATUS=$(aws ecs describe-tasks \
            --cluster ${{ env.ECS_CLUSTER }} \
            --tasks "$MIGRATION_TASK_ARN" \
            --query 'tasks[0].{exitCode:containers[0].exitCode,stoppedReason:stoppedReason}' \
            --output json)
          
          EXIT_CODE=$(echo "$TASK_STATUS" | jq -r '.exitCode // "null"')
          STOPPED_REASON=$(echo "$TASK_STATUS" | jq -r '.stoppedReason // "unknown"')
          
          echo "Task exit code: $EXIT_CODE"
          echo "Stopped reason: $STOPPED_REASON"
          
          if [ "$EXIT_CODE" != "0" ]; then
            echo "Migration failed!"
            echo "Check CloudWatch logs for details: /aws/ecs/acmp-production/migrations"
            exit 1
          fi
          
          echo "Migrations completed successfully!"

  # ----------------------------------------------------------------------------
  # Build and Deploy API
  # ----------------------------------------------------------------------------
  deploy-api:
    name: Deploy API
    runs-on: ubuntu-latest
    needs: [test, changes, run-migrations]
    # Run if API changed, or manually triggered, and wait for migrations if they ran
    if: |
      always() && 
      needs.test.result == 'success' &&
      (needs.changes.outputs.api == 'true' || github.event.inputs.deploy_api == 'true') &&
      (needs.run-migrations.result == 'success' || needs.run-migrations.result == 'skipped')
    environment: production
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-region: ${{ env.AWS_REGION }}
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          role-session-name: GitHubActionsDeployProduction

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Get short commit hash
        run: echo "IMAGE_TAG=${GITHUB_SHA:0:7}" >> $GITHUB_ENV

      - name: Build and push API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./apps/api/Dockerfile
          target: production
          push: true
          tags: |
            ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY_API }}:${{ env.IMAGE_TAG }}
            ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY_API }}:production-latest

      - name: Deploy API to ECS Express Mode
        uses: aws-actions/amazon-ecs-deploy-express-service@v1
        with:
          service-name: ${{ env.ECS_SERVICE_API }}
          cluster: ${{ env.ECS_CLUSTER }}
          image: ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY_API }}:${{ env.IMAGE_TAG }}
          execution-role-arn: ${{ vars.ECS_TASK_EXECUTION_ROLE_ARN }}
          infrastructure-role-arn: ${{ vars.ECS_INFRASTRUCTURE_ROLE_ARN }}
          container-port: 3000
          cpu: '1024'
          memory: '2048'
          health-check-path: /api/health
          min-task-count: 2
          max-task-count: 10
          auto-scaling-metric: AVERAGE_CPU
          auto-scaling-target-value: 70
          environment-variables: |
            [
              {"name": "NODE_ENV", "value": "production"},
              {"name": "PORT", "value": "3000"},
              {"name": "DATABASE_HOST", "value": "${{ vars.DATABASE_HOST }}"},
              {"name": "DATABASE_PORT", "value": "5432"},
              {"name": "DATABASE_USER", "value": "${{ vars.DATABASE_USER }}"},
              {"name": "DATABASE_NAME", "value": "${{ vars.DATABASE_NAME }}"},
              {"name": "DATABASE_SSL", "value": "true"},
              {"name": "JWT_EXPIRES_IN", "value": "7d"},
              {"name": "AWS_REGION", "value": "${{ env.AWS_REGION }}"},
              {"name": "AWS_S3_BUCKET", "value": "${{ vars.AWS_S3_BUCKET }}"},
              {"name": "CORS_ORIGINS", "value": "${{ vars.CORS_ORIGIN }}"},
              {"name": "FRONTEND_URL", "value": "${{ vars.FRONTEND_URL }}"},
              {"name": "MAILCHIMP_FROM_EMAIL", "value": "${{ vars.MAILCHIMP_FROM_EMAIL }}"},
              {"name": "MAILCHIMP_FROM_NAME", "value": "${{ vars.MAILCHIMP_FROM_NAME }}"},
              {"name": "SMTP_HOST", "value": "${{ vars.SMTP_HOST }}"},
              {"name": "SMTP_PORT", "value": "${{ vars.SMTP_PORT }}"},
              {"name": "SMTP_SECURE", "value": "${{ vars.SMTP_SECURE }}"},
              {"name": "SMTP_FROM_EMAIL", "value": "${{ vars.SMTP_FROM_EMAIL }}"},
              {"name": "SMTP_FROM_NAME", "value": "${{ vars.SMTP_FROM_NAME }}"},
              {"name": "REDIS_HOST", "value": "${{ vars.REDIS_HOST }}"},
              {"name": "REDIS_PORT", "value": "6379"}
            ]
          secrets: |
            [
              {"name": "DATABASE_PASSWORD", "valueFrom": "${{ secrets.DATABASE_PASSWORD_ARN }}"},
              {"name": "JWT_SECRET", "valueFrom": "${{ secrets.JWT_SECRET_ARN }}"},
              {"name": "MAILCHIMP_API_KEY", "valueFrom": "${{ secrets.MAILCHIMP_API_KEY_ARN }}"},
              {"name": "SMTP_USER", "valueFrom": "${{ secrets.SMTP_USER_ARN }}"},
              {"name": "SMTP_PASS", "valueFrom": "${{ secrets.SMTP_PASS_ARN }}"}
            ]

  # ----------------------------------------------------------------------------
  # Build and Deploy Web (runs in parallel with API after tests pass)
  # ----------------------------------------------------------------------------
  deploy-web:
    name: Deploy Web
    runs-on: ubuntu-latest
    needs: [test, changes]
    if: needs.test.result == 'success' && (needs.changes.outputs.web == 'true' || github.event.inputs.deploy_web == 'true')
    environment: production
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-region: ${{ env.AWS_REGION }}
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          role-session-name: GitHubActionsDeployProduction

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Get short commit hash
        run: echo "IMAGE_TAG=${GITHUB_SHA:0:7}" >> $GITHUB_ENV

      - name: Build and push Web image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./apps/web/Dockerfile
          target: production
          push: true
          build-args: |
            NEXT_PUBLIC_API_URL=${{ vars.NEXT_PUBLIC_API_URL }}
            NEXT_PUBLIC_WS_URL=${{ vars.NEXT_PUBLIC_WS_URL }}
          tags: |
            ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY_WEB }}:${{ env.IMAGE_TAG }}
            ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY_WEB }}:production-latest

      - name: Deploy Web to ECS Express Mode
        uses: aws-actions/amazon-ecs-deploy-express-service@v1
        with:
          service-name: ${{ env.ECS_SERVICE_WEB }}
          cluster: ${{ env.ECS_CLUSTER }}
          image: ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY_WEB }}:${{ env.IMAGE_TAG }}
          execution-role-arn: ${{ vars.ECS_TASK_EXECUTION_ROLE_ARN }}
          infrastructure-role-arn: ${{ vars.ECS_INFRASTRUCTURE_ROLE_ARN }}
          container-port: 3000
          cpu: '512'
          memory: '1024'
          health-check-path: /api/health
          min-task-count: 2
          max-task-count: 6
          auto-scaling-metric: AVERAGE_CPU
          auto-scaling-target-value: 70
