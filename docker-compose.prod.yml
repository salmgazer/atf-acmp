# ==============================================================================
# Production Mode Docker Compose Override
# Usage: docker compose -f docker-compose.yml -f docker-compose.prod.yml up --build
# Or use the npm script: npm run docker:prod
# ==============================================================================

services:
  # API in production mode
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      target: production
    environment:
      NODE_ENV: production
      PORT: 3001
    volumes: []  # No source mounting in production

  # Web in production mode  
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      target: production
      args:
        # These are baked into the client-side bundle at build time
        # Use localhost for browser access
        NEXT_PUBLIC_API_URL: http://localhost:3001/api
        NEXT_PUBLIC_WS_URL: ws://localhost:3001
        NEXT_PUBLIC_FIREBASE_API_KEY: ${NEXT_PUBLIC_FIREBASE_API_KEY:-}
        NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: ${NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN:-}
        NEXT_PUBLIC_FIREBASE_PROJECT_ID: ${NEXT_PUBLIC_FIREBASE_PROJECT_ID:-}
        NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET: ${NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET:-}
        NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: ${NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID:-}
        NEXT_PUBLIC_FIREBASE_APP_ID: ${NEXT_PUBLIC_FIREBASE_APP_ID:-}
    environment:
      NODE_ENV: production
      PORT: 3000
      # Server-side API calls need to use the Docker network
      API_INTERNAL_URL: http://api:3001/api
    volumes: []  # No source mounting in production
